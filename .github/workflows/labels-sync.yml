name: Sync labels

on:
  push:
    branches: [main]
    paths: ['.github/labels.yml']
  pull_request:
    paths: ['.github/labels.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/tools

      - name: Referenced labels exist
        run: bash .github/scripts/check-labels.sh

      - uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          yaml-file: .github/labels.yml
          # On a PR, show what would change without applying it. The real sync
          # only happens after the merge.
          dry-run: ${{ github.event_name == 'pull_request' }}
          # Deleting a label erases the classification history of every issue
          # that used it, and that does not come back. Removal is a manual,
          # deliberate operation; dropping the line from the file should not be
          # enough to trigger it.
          skip-delete: true
          exclude: |
            duplicate
            good first issue
            help wanted
            invalid
            question
            wontfix
            dependencies
