name: CI

on:
  pull_request:
  push:
    branches: [main]

# Minimum by default; each job raises what it needs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ------------------------------------------------------------------
  # Survey the ground. Until package.json exists, the application jobs
  # skip themselves — the pipeline is born complete and switches on when
  # the app arrives, instead of being born half-written.
  # ------------------------------------------------------------------
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.detect.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tools the checks assume
        run: bash .claude/hooks/preflight.sh

      - name: Is there an application to test?
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "package.json found — application jobs will run."
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "No package.json — application jobs skip themselves."
            echo "That is expected while the product does not exist. The 'contract' job runs regardless."
          fi

      # `pnpm lint` against a missing script fails with "Command not found",
      # which sends the reader hunting for a lint bug instead of a package.json
      # one. Better to say exactly what is missing, once.
      - name: package.json script contract
        if: steps.detect.outputs.app == 'true'
        run: |
          missing=()
          for s in lint typecheck test test:e2e build; do
            jq -e --arg s "$s" '.scripts[$s]' package.json >/dev/null 2>&1 || missing+=("$s")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::package.json does not define: ${missing[*]}"
            echo "CI calls those five scripts. Define them, or adjust .github/workflows/ci.yml."
            exit 1
          fi
          echo "All five scripts CI calls are defined."

  # ------------------------------------------------------------------
  # The contract. Runs unconditionally: it is what already exists today,
  # and the only reason this pipeline was urgent.
  # ------------------------------------------------------------------
  contract:
    name: contract
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same script the /ds-check skill and the Edit/Write hook call. One
      # implementation, three callers: the same regex re-typed into YAML would
      # be a guarantee of drift from ds-rules.sh.
      - name: DESIGN-SYSTEM.md §8 and §12
        run: bash .claude/skills/ds-check/ds-check.sh

      # §9: copy lives in locale files, and a locale that exists is complete.
      # Skips cleanly while src/locales does not exist.
      - name: Locale parity (§9)
        run: bash .github/scripts/check-locales.sh

      - name: Referenced labels exist
        run: bash .github/scripts/check-labels.sh

  # ------------------------------------------------------------------
  # The harness enforces the contract. A bug in the enforcer switches the
  # contract off without a single rule being touched.
  # ------------------------------------------------------------------
  shell:
    name: shell
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          printf 'Analysing %d scripts:\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          shellcheck --severity=warning "${files[@]}"

      # The workflows are the gate. An expression error in an `if:` does not
      # break the workflow: it evaluates to false and the job skips silently,
      # which in the checks list is indistinguishable from "did not need to run".
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  # ------------------------------------------------------------------
  # Application. All conditional on package.json.
  # ------------------------------------------------------------------
  lint:
    name: lint and types
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.app == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  tests:
    name: tests
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.app == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    name: e2e and a11y
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.app == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox
      # Most of the §10 floor needs a human, but the slice axe covers —
      # contrast, accessible name, role, focus order — needs none, and should
      # not be spending review attention.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: build
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.app == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # ------------------------------------------------------------------
  # The only required check in the ruleset.
  #
  # Why: on GitHub a SKIPPED job counts as success for required checks.
  # Requiring 'tests' and 'lint' directly builds a protection that switches
  # itself off the day a job is skipped by a condition, a path filter, or a
  # typo in an `if:`. Here the distinction is explicit: the contract jobs must
  # have passed, and the application jobs may be skipped while there is no
  # application — but never failed, and never skipped because a dependency fell.
  #
  # This job's name is stable forever. The ones inside it can be renamed
  # without touching the ruleset.
  # ------------------------------------------------------------------
  gate:
    name: gate
    runs-on: ubuntu-latest
    if: always()
    needs: [preflight, contract, shell, lint, tests, e2e, build]
    steps:
      - name: Aggregate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$RESULTS" > results.json
          jq -r 'to_entries[] | "  \(.key): \(.value.result)"' results.json

          # Always required: anything other than success fails, including
          # skipped — if these were skipped, something broke upstream.
          always='["preflight","contract","shell"]'
          bad=$(jq -r --argjson k "$always" \
            'to_entries[] | select(.key as $x | $k | index($x)) | select(.value.result != "success") | .key' \
            results.json)

          # Conditional: success or skipped. Cancelled and failure both fail.
          conditional='["lint","tests","e2e","build"]'
          bad="$bad$(jq -r --argjson k "$conditional" \
            'to_entries[] | select(.key as $x | $k | index($x)) | select(.value.result != "success" and .value.result != "skipped") | .key' \
            results.json)"

          if [ -n "$(printf '%s' "$bad" | tr -d '[:space:]')" ]; then
            echo "::error::gate failed: $(printf '%s' "$bad" | tr '\n' ' ')"
            exit 1
          fi
          echo "gate passed."

  # ------------------------------------------------------------------
  # Delivery. After the gate, never alongside it.
  #
  # Vercel's Git integration is switched off in vercel.json on purpose: it
  # deploys on push, in parallel with CI, and the preview would go up even
  # with CI red — which turns the gate into decoration.
  # ------------------------------------------------------------------
  preview:
    name: preview
    runs-on: ubuntu-latest
    needs: [gate, preflight]
    if: >-
      github.event_name == 'pull_request' &&
      needs.preflight.outputs.app == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Deploy
        id: deploy
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "$url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Did the headers reach the response?
        run: bash .github/scripts/smoke-headers.sh "${{ steps.deploy.outputs.url }}"

      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: preview
          message: |
            **Preview:** ${{ steps.deploy.outputs.url }}

            Before approving, the floor no script catches: 360px, keyboard with
            visible focus, light and dark on the same screen, and the grid still
            readable under colour-blindness simulation.

  production:
    name: production
    runs-on: ubuntu-latest
    needs: [gate, preflight]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.preflight.outputs.app == 'true'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Deploy
        id: deploy
        run: |
          npm install --global vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "$url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Did the headers reach the response?
        run: bash .github/scripts/smoke-headers.sh "${{ steps.deploy.outputs.url }}"
