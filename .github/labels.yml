# ---------- state · why the card is not moving ----------
# Airflow calls it state, not status. The product's vocabulary wins over the
# GitHub habit here, the same way it does in the UI.
- name: "state/blocked"
  color: "C2410C"
  description: "Waiting on something external. Moves the card to Blocked"
- name: "state/needs-decision"
  color: "6B4EC7"
  description: "Needs a line in DECISIONS.md before it can move"
- name: "state/needs-verification"
  color: "6B4EC7"
  description: "Contains an Airflow claim not yet checked against the source"

# ---------- severity ----------
- name: "severity/critical"
  color: "8B0000"
  description: "Jumps the queue. Teaches something false, or production is down"

# ---------- release notes ----------
- name: "no-changelog"
  color: "9AA5B4"
  description: "Kept out of the release notes"
