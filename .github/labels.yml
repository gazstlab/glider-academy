# Labels live in version control. A label created by hand in the browser
# disappears in the first cleanup; a label in a file is reviewable in a PR and
# comes back on its own.
#
# Colors mirror the light-theme state palette so the board reads next to the
# product. They are NOT tokens: this is GitHub chrome, not Glider UI, and
# tokens.css remains the single source of truth for product values.

# ---------- type · what the work is ----------
- name: "type/lesson"
  color: "017CEE"
  description: "Teaching content: a lesson or a lab"
- name: "type/component"
  color: "3E7FB8"
  description: "UI component, variant or prop"
- name: "type/bug"
  color: "C1272D"
  description: "Something does not work as it should"
- name: "type/content-error"
  color: "8B0000"
  description: "Glider taught something false about Airflow"
- name: "type/chore"
  color: "6B7A90"
  description: "Harness, pipeline, dependency, refactor"

